<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Meal Tracker</title>
<style>
:root{--g:#1b7f4b;--gd:#145f38;--bg:#f3f6f4;--t:#1d2a23;--m:#6b7a72;--b:#dbe3de;--r:#d64545;--a:#e0a100}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:19px}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
main{max-width:640px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.btn{display:block;width:100%;text-align:center;background:var(--g);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:8px}
.btn.sec{background:#e5ebe7;color:var(--t)}
.btn.red{background:var(--r)}
.btn.big{padding:22px;font-size:19px}
.btn:disabled{opacity:.5}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--b);border-radius:10px;padding:13px;font-size:16px;margin-bottom:8px;cursor:pointer;color:var(--t)}
.opt small{color:var(--m);float:right}
.opt:active{background:#e8f5ee}
input[type=file]{display:none}
input[type=password],input[type=text]{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;font-size:15px}
label.l{font-size:13px;color:var(--m);display:block;margin:10px 0 4px}
.hide{display:none!important}
.who{background:#e8f5ee;border-radius:10px;padding:12px;margin-bottom:12px}
.who b{font-size:20px}
.who div{color:var(--m);font-size:14px;margin-top:2px}
.meals{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.meals button{padding:12px 6px;border:2px solid var(--b);background:#fff;border-radius:10px;font-size:15px;font-weight:600;color:var(--t)}
.meals button.on{border-color:var(--g);background:#e8f5ee;color:var(--gd)}
.meals button.done::after{content:" \2713";color:var(--g)}
.crumb{font-size:13px;color:var(--m);margin-bottom:10px}
#qr-reader{width:100%;border-radius:10px;overflow:hidden;background:#000}
#preview{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--b)}
th{font-size:12px;color:var(--m)}
.tot td{font-weight:700;background:#f3f6f4}
.tw{overflow-x:auto}
.msg{padding:10px;border-radius:8px;margin:8px 0;font-size:14px}
.err{background:#fdeaea;color:#8f1d1d}
.info{background:#e8f1fb;color:#1d4a7f}
.good{background:#e8f5ee;color:var(--gd)}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.ok{background:var(--g)}.watch{background:var(--a)}.risk{background:var(--r)}
.bar{height:12px;background:#e5ebe7;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--g)}
.pg td,.pg th{text-align:center;padding:5px 2px}
.pg td:first-child,.pg th:first-child{text-align:left}
.yes{color:var(--g);font-weight:700}.no{color:#c0c8c3}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.qrc{border:1px solid var(--b);border-radius:10px;padding:8px;text-align:center;font-size:12px;background:#fff}
small.m{color:var(--m)}
@media print{header,.noprint{display:none!important}}
</style>
</head>
<body>
<header><h1>Mess Meal Tracker</h1><button id="btn-set" class="noprint">Settings</button></header>
<main>

<!-- HOME -->
<section id="v-home">
  <div class="card">
    <button class="btn big" id="btn-next">Next student (scan QR)</button>
    <button class="btn sec" id="btn-list">Choose from class list</button>
  </div>
  <div class="card">
    <h2>Engines</h2>
    <label class="l">Main engine: Gemini API key</label>
    <input id="hk-g" type="password" placeholder="AIza..." autocomplete="off">
    <label class="l">Backup engine: Groq API key (optional)</label>
    <input id="hk-q" type="password" placeholder="gsk_..." autocomplete="off">
    <small class="m">Saved automatically. If Gemini fails, it tries other Gemini models, then Groq.</small>
  </div>
  <p style="text-align:center"><a href="#" id="lnk-qrs" style="color:var(--g);font-size:14px">Student QR codes (for testing / printing)</a></p>
</section>

<!-- SCAN -->
<section id="v-scan" class="hide">
  <div class="card">
    <h2>Show the student's QR to the camera</h2>
    <div id="qr-reader"></div>
    <div id="scan-msg"></div>
    <label class="btn sec" for="qr-file" style="margin-top:10px">Camera not working? Scan from a photo</label>
    <input type="file" id="qr-file" accept="image/*">
    <button class="btn sec" id="btn-scan-cancel">Cancel</button>
  </div>
</section>

<!-- PICK -->
<section id="v-pick" class="hide">
  <div class="card">
    <div class="crumb" id="pk-crumb"></div>
    <div id="pk-body"></div>
    <button class="btn sec" id="pk-back">Back</button>
  </div>
</section>

<!-- STUDENT -->
<section id="v-student" class="hide">
  <button class="btn sec" id="btn-next2">&larr; Next student</button>
  <div class="who" id="who"></div>

  <div class="card">
    <h2>Add meal</h2>
    <div class="meals" id="meals"></div>
    <label class="btn" for="meal-file" id="lbl-add">Add meal (choose photo)</label>
    <input type="file" id="meal-file" accept="image/*">
    <div id="meal-area" class="hide">
      <img id="preview" alt="Meal">
      <div id="status"></div>
      <div id="result"></div>
      <button class="btn hide" id="btn-save">Save meal</button>
    </div>
  </div>

  <div class="card" id="progress"></div>
</section>

<!-- QR LIST -->
<section id="v-qrs" class="hide">
  <div class="card">
    <div class="noprint">
      <button class="btn sec" onclick="window.print()">Print</button>
      <button class="btn sec" id="qrs-back">Back</button>
    </div>
    <div class="qrs" id="qr-list"></div>
  </div>
</section>

<!-- SETTINGS -->
<section id="v-set" class="hide">
  <div class="card">
    <h2>API keys</h2>
    <label class="l">Gemini API key (aistudio.google.com/apikey)</label>
    <input id="set-g" type="password" placeholder="AIza..." autocomplete="off">
    <label class="l">Backup: Groq API key (console.groq.com/keys)</label>
    <input id="set-q" type="password" placeholder="gsk_..." autocomplete="off">
    <button class="btn" id="set-save" style="margin-top:12px">Save</button>
    <div id="set-msg"></div>
  </div>
  <div class="card">
    <h2>Data</h2>
    <button class="btn sec" id="btn-demo">Load demo meal history</button>
    <button class="btn red" id="btn-clear">Clear all meal records</button>
    <button class="btn sec" id="set-back">Back</button>
  </div>
</section>

</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round((+n||0)*10)/10;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('Browser storage is full or blocked.');return false}}
};

/* ---------- Prebuilt roster (edit freely) ---------- */
// gender: M = boys, F = girls
const ROSTER=[
 {id:'S001',name:'Aarav Kumar',cls:'8',sec:'A',house:'Aravali',g:'M'},
 {id:'S002',name:'Rohit Yadav',cls:'8',sec:'A',house:'Nilgiri',g:'M'},
 {id:'S003',name:'Mohit Singh',cls:'8',sec:'B',house:'Aravali',g:'M'},
 {id:'S004',name:'Karan Mehta',cls:'8',sec:'B',house:'Shivalik',g:'M'},
 {id:'S005',name:'Priya Sharma',cls:'8',sec:'A',house:'Udaygiri',g:'F'},
 {id:'S006',name:'Neha Patel',cls:'8',sec:'B',house:'Nilgiri',g:'F'},
 {id:'S007',name:'Sneha Das',cls:'8',sec:'A',house:'Udaygiri',g:'F'},
 {id:'S008',name:'Arjun Nayak',cls:'9',sec:'A',house:'Shivalik',g:'M'},
 {id:'S009',name:'Vikram Sahu',cls:'9',sec:'A',house:'Aravali',g:'M'},
 {id:'S010',name:'Suresh Behera',cls:'9',sec:'B',house:'Shivalik',g:'M'},
 {id:'S011',name:'Anjali Verma',cls:'9',sec:'A',house:'Nilgiri',g:'F'},
 {id:'S012',name:'Pooja Mishra',cls:'9',sec:'B',house:'Udaygiri',g:'F'},
 {id:'S013',name:'Riya Panda',cls:'9',sec:'B',house:'Nilgiri',g:'F'},
 {id:'S014',name:'Deepak Rout',cls:'10',sec:'A',house:'Udaygiri',g:'M'},
 {id:'S015',name:'Amit Jena',cls:'10',sec:'A',house:'Aravali',g:'M'},
 {id:'S016',name:'Sourav Mohanty',cls:'10',sec:'B',house:'Nilgiri',g:'M'},
 {id:'S017',name:'Kavya Nair',cls:'10',sec:'A',house:'Shivalik',g:'F'},
 {id:'S018',name:'Ananya Roy',cls:'10',sec:'B',house:'Aravali',g:'F'},
 {id:'S019',name:'Ishita Gupta',cls:'10',sec:'B',house:'Udaygiri',g:'F'}
];
const MEALS=['Breakfast','Lunch','Snacks','Dinner'];
let records=store.get('records2',[]);
let keys=store.get('keys2',{g:'',q:''});

/* ---------- Navigation ---------- */
const VIEWS=['home','scan','pick','student','qrs','set'];
let qr=null;
function go(v){
  stopQR();
  VIEWS.forEach(x=>$('#v-'+x).classList.toggle('hide',x!==v));
  window.scrollTo(0,0);
}
function loadScript(urls){
  return new Promise((res,rej)=>{
    let i=0;
    (function next(){
      if(i>=urls.length) return rej(new Error('Could not load library (check internet)'));
      const s=document.createElement('script'); s.src=urls[i++];
      s.onload=res; s.onerror=next; document.head.appendChild(s);
    })();
  });
}
let scanLib=null,genLib=null;
const needScanner=()=>scanLib||(scanLib=window.Html5Qrcode?Promise.resolve():loadScript(['https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js','https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js']));
const needGen=()=>genLib||(genLib=window.qrcode?Promise.resolve():loadScript(['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js','https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js']));

$('#btn-next').onclick=startScan;
$('#btn-next2').onclick=()=>go('home');
$('#btn-list').onclick=()=>{ pk={cls:null,g:null,house:null}; renderPick(); go('pick'); };
$('#btn-scan-cancel').onclick=()=>go('home');
$('#btn-set').onclick=()=>{ $('#set-g').value=keys.g; $('#set-q').value=keys.q; go('set'); };
$('#set-back').onclick=()=>go('home');
$('#lnk-qrs').onclick=e=>{ e.preventDefault(); renderQRs(); go('qrs'); };
$('#qrs-back').onclick=()=>go('home');

/* ---------- QR scan ---------- */
function scanMsg(t,type='err'){ $('#scan-msg').innerHTML=t?`<div class="msg ${type}">${esc(t)}</div>`:''; }
async function stopQR(){
  if(qr){ try{await qr.stop()}catch(e){} try{qr.clear()}catch(e){} qr=null; }
}
async function startScan(){
  go('scan'); scanMsg('');
  try{
    await needScanner();
    qr=new Html5Qrcode('qr-reader');
    await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},onScan,()=>{});
  }catch(e){
    scanMsg('Camera error: '+(e&&e.message?e.message:e)+'. Camera needs HTTPS (a hosted page) and permission. You can scan from a photo or use the class list.');
  }
}
function parseQR(text){
  // Format: JNV|ID|Name|Class|Section|House   (ID alone also works)
  const p=String(text).split('|').map(x=>x.trim());
  if(p[0]==='JNV'&&p.length>=3){
    const known=ROSTER.find(s=>s.id===p[1]);
    return known||{id:p[1],name:p[2],cls:p[3]||'',sec:p[4]||'',house:p[5]||'',g:''};
  }
  return ROSTER.find(s=>s.id===String(text).trim())||null;
}
async function onScan(text){
  const s=parseQR(text);
  if(!s){ scanMsg('Unknown QR: '+text); return; }
  await stopQR();
  openStudent(s);
}
$('#qr-file').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    await needScanner(); await stopQR();
    const sc=new Html5Qrcode('qr-reader');
    const text=await sc.scanFile(f,false);
    try{sc.clear()}catch(x){}
    const s=parseQR(text);
    if(!s) return scanMsg('Unknown QR: '+text);
    openStudent(s);
  }catch(err){ scanMsg('No QR found in that photo.'); }
};

/* ---------- Class -> Boys/Girls -> House -> Student ---------- */
let pk={cls:null,g:null,house:null};
function renderPick(){
  const b=$('#pk-body'), c=[];
  if(pk.cls) c.push('Class '+pk.cls);
  if(pk.g) c.push(pk.g==='M'?'Boys':'Girls');
  if(pk.house) c.push(pk.house);
  $('#pk-crumb').textContent=c.length?c.join('  >  '):'Step 1: choose class';
  let h='';
  if(!pk.cls){
    [...new Set(ROSTER.map(s=>s.cls))].sort((a,b)=>a-b).forEach(x=>h+=`<button class="opt" data-k="cls" data-v="${esc(x)}">Class ${esc(x)}</button>`);
  }else if(!pk.g){
    h+='<button class="opt" data-k="g" data-v="M">Boys</button><button class="opt" data-k="g" data-v="F">Girls</button>';
  }else if(!pk.house){
    [...new Set(ROSTER.filter(s=>s.cls===pk.cls&&s.g===pk.g).map(s=>s.house))].sort().forEach(x=>h+=`<button class="opt" data-k="house" data-v="${esc(x)}">${esc(x)} House</button>`);
    if(!h) h='<p>No students here.</p>';
  }else{
    ROSTER.filter(s=>s.cls===pk.cls&&s.g===pk.g&&s.house===pk.house).sort((a,b)=>a.name.localeCompare(b.name))
      .forEach(s=>h+=`<button class="opt" data-sid="${esc(s.id)}">${esc(s.name)}<small>Sec ${esc(s.sec)}</small></button>`);
  }
  b.innerHTML=h;
  b.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{ pk[x.dataset.k]=x.dataset.v; renderPick(); });
  b.querySelectorAll('[data-sid]').forEach(x=>x.onclick=()=>openStudent(ROSTER.find(s=>s.id===x.dataset.sid)));
}
$('#pk-back').onclick=()=>{
  if(pk.house) pk.house=null; else if(pk.g) pk.g=null; else if(pk.cls) pk.cls=null; else return go('home');
  renderPick();
};

/* ---------- Student screen ---------- */
let cur=null, selMeal='Lunch', curItems=[], curTotals=null, curThumb=null, b64=null;
function autoMeal(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  return h<10.5?'Breakfast':h<16?'Lunch':h<19?'Snacks':'Dinner';
}
function openStudent(s){
  cur=s; selMeal=autoMeal(); resetMeal();
  $('#who').innerHTML=`<b>${esc(s.name)}</b><div>Class ${esc(s.cls)}${s.sec?' - '+esc(s.sec):''}${s.house?' | '+esc(s.house)+' House':''}</div><div>ID ${esc(s.id)}</div>`;
  renderMeals(); renderProgress();
  go('student');
}
function doneToday(m){ const d=ymd(new Date()); return records.some(r=>r.sid===cur.id&&r.date===d&&r.meal===m); }
function renderMeals(){
  const box=$('#meals');
  box.innerHTML=MEALS.map(m=>`<button data-m="${m}" class="${m===selMeal?'on':''} ${doneToday(m)?'done':''}">${m}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ selMeal=b.dataset.m; renderMeals(); });
}
function resetMeal(){
  b64=null; curItems=[]; curTotals=null;
  $('#meal-area').classList.add('hide'); $('#status').innerHTML=''; $('#result').innerHTML='';
  $('#btn-save').classList.add('hide'); $('#btn-save').disabled=false;
}

/* ---------- Progress ---------- */
function renderProgress(){
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const mine=records.filter(r=>r.sid===cur.id);
  const has=(d,m)=>mine.some(r=>r.date===ymd(d)&&r.meal===m);
  let taken=0;
  days.forEach(d=>MEALS.forEach(m=>{ if(has(d,m)) taken++; }));
  const expected=6*4+MEALS.indexOf(autoMeal());   // today: only meals already passed
  const pct=expected?Math.min(100,Math.round(taken/expected*100)):0;
  const cls=pct>=80?'ok':pct>=50?'watch':'risk';
  const lab=pct>=80?'Regular':pct>=50?'Irregular':'Rarely eating';
  const wk=mine.filter(r=>days.some(d=>ymd(d)===r.date));
  const nd=new Set(wk.map(r=>r.date)).size;
  const avgK=nd?Math.round(wk.reduce((a,r)=>a+r.kcal,0)/nd):0;
  const missed=Math.max(0,expected-taken);
  const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let h=`<h2>Progress (last 7 days)</h2>
    <div><span class="pill ${cls}">${lab}</span> <b style="margin-left:6px">${pct}%</b> of meals taken</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <small class="m">${taken} meals taken${missed?', '+missed+' missed':''}${nd?' | avg '+avgK+' kcal/day':''}</small>
    <div class="tw" style="margin-top:10px"><table class="pg"><tr><th></th>${days.map(d=>`<th>${dn[d.getDay()]}</th>`).join('')}</tr>`;
  MEALS.forEach(m=>{ h+=`<tr><td>${m}</td>${days.map(d=>`<td class="${has(d,m)?'yes':'no'}">${has(d,m)?'&#10003;':'-'}</td>`).join('')}</tr>`; });
  h+='</table></div>';
  $('#progress').innerHTML=h;
}

/* ---------- Meal photo + AI ---------- */
const GEMINI_MODELS=['gemini-3.8-flash','gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-2.5-flash-lite'];
const GROQ_MODEL='meta-llama/llama-4-scout-17b-16e-instruct';
const PROMPT='You are a nutrition assistant. The photo shows an Indian meal/thali. Identify every food item and estimate cooked weight in grams and nutrition for that portion. Return ONLY JSON: {"items":[{"name":"string","grams":number,"kcal":number,"protein_g":number,"carbs_g":number,"fat_g":number}],"confidence":"low|medium|high","note":"short string"}. If no food is visible, return empty items.';

function parseJSON(t){
  t=String(t).replace(/```json|```/g,'');
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<0) throw new Error('No JSON in reply');
  return JSON.parse(t.slice(a,b+1));
}
async function timed(url,opts,ms){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),ms);
  try{ return await fetch(url,Object.assign({signal:ctl.signal},opts)); }
  catch(e){ throw new Error(e.name==='AbortError'?'timed out':e.message); }
  finally{ clearTimeout(t); }
}
async function callGemini(key,model){
  const r=await timed('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(key),{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0.2}})
  },25000);
  const j=await r.json();
  if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
  if(!t) throw new Error('empty reply');
  return parseJSON(t);
}
async function callGroq(key){
  const r=await timed('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:GROQ_MODEL,temperature:0.2,response_format:{type:'json_object'},
      messages:[{role:'user',content:[{type:'text',text:PROMPT},{type:'image_url',image_url:{url:'data:image/jpeg;base64,'+b64}}]}]})
  },25000);
  const j=await r.json();
  if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  return parseJSON(j.choices[0].message.content);
}

$('#meal-file').onchange=e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const img=new Image();
  img.onload=()=>{
    const sc=(max,q)=>{ const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q); };
    const url=sc(1000,0.85); b64=url.split(',')[1]; curThumb=sc(120,0.5);
    URL.revokeObjectURL(img.src);
    $('#preview').src=url;
    $('#meal-area').classList.remove('hide');
    analyze();
  };
  img.src=URL.createObjectURL(f);
};

async function analyze(){
  curItems=[]; curTotals=null; $('#result').innerHTML=''; $('#btn-save').classList.add('hide');
  if(!keys.g&&!keys.q){ $('#status').innerHTML='<div class="msg err">Add a Gemini or Groq API key in Settings.</div>'; return; }
  const steps=[];
  if(keys.g) GEMINI_MODELS.forEach(m=>steps.push({name:m,run:()=>callGemini(keys.g,m)}));
  if(keys.q) steps.push({name:'Groq',run:()=>callGroq(keys.q)});
  const errs=[]; let data=null, used='';
  for(const st of steps){
    $('#status').innerHTML='<div class="msg info">Analyzing with '+esc(st.name)+'...'+(errs.length?' (previous failed, trying next)':'')+'</div>';
    try{ data=await st.run(); used=st.name; break; }catch(e){ errs.push(st.name+': '+(e.message||e)); }
  }
  if(!data){ $('#status').innerHTML='<div class="msg err">All providers failed:<br>'+errs.map(esc).join('<br>')+'</div>'; return; }
  curItems=(data.items||[]).map(i=>({name:String(i.name||'item'),g:Math.round(+i.grams||0),kcal:+i.kcal||0,p:+i.protein_g||0,c:+i.carbs_g||0,f:+i.fat_g||0}));
  const T={g:0,kcal:0,p:0,c:0,f:0};
  let h='<div class="tw"><table><tr><th>Item</th><th>g</th><th>kcal</th><th>Prot</th><th>Carb</th><th>Fat</th></tr>';
  curItems.forEach(i=>{ T.g+=i.g;T.kcal+=i.kcal;T.p+=i.p;T.c+=i.c;T.f+=i.f;
    h+=`<tr><td>${esc(i.name)}</td><td>${i.g}</td><td>${Math.round(i.kcal)}</td><td>${r1(i.p)}</td><td>${r1(i.c)}</td><td>${r1(i.f)}</td></tr>`; });
  h+=`<tr class="tot"><td>Total</td><td>${T.g}</td><td>${Math.round(T.kcal)}</td><td>${r1(T.p)}</td><td>${r1(T.c)}</td><td>${r1(T.f)}</td></tr></table></div>`;
  if(!curItems.length) h='<div class="msg info">No food detected.</div>';
  h+=`<small class="m">Confidence: ${esc(data.confidence||'n/a')}. ${esc(data.note||'')} Estimates only. Answered by ${esc(used)}.</small>`;
  curTotals=T;
  $('#status').innerHTML=''; $('#result').innerHTML=h;
  $('#btn-save').classList.remove('hide'); $('#btn-save').textContent='Save '+selMeal;
}

$('#btn-save').onclick=()=>{
  if(!cur||!curTotals) return;
  const date=ymd(new Date());
  records=records.filter(r=>!(r.sid===cur.id&&r.date===date&&r.meal===selMeal));
  records.push({sid:cur.id,name:cur.name,date,meal:selMeal,time:new Date().toTimeString().slice(0,5),
    kcal:Math.round(curTotals.kcal),protein:r1(curTotals.p),carbs:r1(curTotals.c),fat:r1(curTotals.f),
    items:curItems.map(i=>({name:i.name,g:i.g})),thumb:curThumb});
  if(store.set('records2',records)){
    $('#btn-save').disabled=true;
    $('#status').innerHTML=`<div class="msg good">${esc(selMeal)} saved for ${esc(cur.name)}.</div>`;
    renderMeals(); renderProgress();
  }
};

/* ---------- QR codes list ---------- */
async function renderQRs(){
  const box=$('#qr-list');
  try{ await needGen(); }catch(e){ box.innerHTML='<div class="msg err">'+esc(e.message)+'</div>'; return; }
  box.innerHTML=ROSTER.map(s=>{
    const q=qrcode(0,'M'); q.addData(`JNV|${s.id}|${s.name}|${s.cls}|${s.sec}|${s.house}`); q.make();
    return `<div class="qrc">${q.createImgTag(4,4)}<br><b>${esc(s.name)}</b><br>Class ${esc(s.cls)}-${esc(s.sec)} | ${esc(s.house)}</div>`;
  }).join('');
}

/* ---------- Settings ---------- */
$('#set-save').onclick=()=>{
  keys={g:$('#set-g').value.trim(),q:$('#set-q').value.trim()};
  store.set('keys2',keys);
  $('#set-msg').innerHTML='<div class="msg good">Saved.</div>';
  setTimeout(()=>$('#set-msg').innerHTML='',2000);
};
$('#btn-clear').onclick=()=>{ if(confirm('Delete all meal records?')){ records=[]; store.set('records2',records); } };
$('#btn-demo').onclick=()=>{
  const rnd=Math.random;
  ROSTER.forEach((s,idx)=>{
    const rate=[0.95,0.8,0.55,0.3][idx%4];
    for(let i=1;i<=6;i++){
      const d=new Date(); d.setDate(d.getDate()-i); const date=ymd(d);
      MEALS.forEach(m=>{
        if(rnd()>rate) return;
        const base={Breakfast:380,Lunch:800,Snacks:250,Dinner:760}[m]*(0.85+rnd()*0.25);
        records=records.filter(r=>!(r.sid===s.id&&r.date===date&&r.meal===m));
        records.push({sid:s.id,name:s.name,date,meal:m,time:'12:00',kcal:Math.round(base),protein:r1(base*0.027),carbs:r1(base*0.13),fat:r1(base*0.03),items:[],thumb:''});
      });
    }
  });
  store.set('records2',records);
  $('#set-msg').innerHTML='<div class="msg good">Demo history loaded.</div>';
};

function syncKeys(){ $('#hk-g').value=keys.g; $('#hk-q').value=keys.q; $('#set-g').value=keys.g; $('#set-q').value=keys.q; }
['hk-g','hk-q'].forEach(id=>$('#'+id).oninput=()=>{
  keys={g:$('#hk-g').value.trim(),q:$('#hk-q').value.trim()}; store.set('keys2',keys);
});
const _save=$('#set-save').onclick;
$('#set-save').onclick=()=>{ _save(); syncKeys(); };
const _setBtn=$('#btn-set').onclick;
$('#btn-set').onclick=()=>{ syncKeys(); _setBtn(); };
syncKeys();
go('home');
</script>
</body>
